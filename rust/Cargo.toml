[package]
name = "cedar-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "cedar_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
cedar-policy = { version = "4.11", features = ["permissive-validate"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
